<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<link rel="icon" type="image/png" sizes="192x192" href="app-icon-tasks-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="app-icon-tasks-512.png">
<link rel="apple-touch-icon" href="app-icon-tasks-512.png">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f5f3ee;
    --surface:   #ffffff;
    --sidebar:   #1c1917;
    --ink:       #1c1917;
    --ink-2:     #57534e;
    --ink-3:     #a8a29e;
    --border:    #e7e5e4;
    --accent:    #d97706;
    --accent-2:  #f59e0b;
    --p1:        #dc2626;   /* priority 1 */
    --p2:        #d97706;   /* priority 2 */
    --p3:        #2563eb;   /* priority 3 */
    --p4:        #a8a29e;   /* no priority */
    --done:      #16a34a;
    --radius:    10px;
    --sidebar-w: 240px;
    --trans:     all .18s ease;
  }

  html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); }

  /* ── LAYOUT ── */
  .shell { display: flex; height: 100vh; overflow: hidden; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar);
    color: #e7e5e4;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    padding: 0 0 1rem 0;
    overflow-y: auto;
  }

  .sidebar-logo {
    padding: 1.5rem 1.25rem 1rem;
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    letter-spacing: -0.02em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,.08);
    margin-bottom: 0.5rem;
  }

  .sidebar-logo .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent-2);
  }

  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--done);
    margin-left: auto;
    flex-shrink: 0;
    transition: background .3s;
  }
  .sync-dot.syncing { background: var(--accent-2); animation: blink 1s infinite; }
  .sync-dot.offline  { background: var(--p1); animation: none; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .sidebar-section {
    padding: 0.25rem 0;
  }

  .sidebar-label {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #78716c;
    padding: 0.6rem 1.25rem 0.3rem;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 1.25rem;
    font-size: 0.875rem;
    font-weight: 400;
    color: #d6d3d1;
    cursor: pointer;
    border-radius: 0;
    transition: var(--trans);
    user-select: none;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,.1); color: #fff; border-left-color: var(--accent-2); font-weight: 500; }

  .nav-item .nav-icon { font-size: 1rem; width: 1.2rem; text-align: center; flex-shrink: 0; }
  .nav-item .nav-count {
    margin-left: auto;
    font-size: 0.7rem;
    background: rgba(255,255,255,.12);
    color: #d6d3d1;
    padding: 1px 6px;
    border-radius: 20px;
    font-weight: 500;
  }

  .list-color-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .add-list-btn {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 1.25rem;
    font-size: 0.8rem;
    color: #78716c;
    cursor: pointer;
    transition: var(--trans);
  }
  .add-list-btn:hover { color: #d6d3d1; }

  /* ── MAIN ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    padding: 1.5rem 2rem 0;
    flex-shrink: 0;
  }

  .view-title {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    letter-spacing: -0.03em;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 0.15rem;
  }

  .view-subtitle {
    font-size: 0.8rem;
    color: var(--ink-3);
    font-weight: 300;
  }

  /* ── SORT / FILTER BAR ── */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 2rem;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }

  .filter-chip {
    font-size: 0.75rem;
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
    transition: var(--trans);
    font-weight: 500;
  }
  .filter-chip:hover, .filter-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .filter-sep { width: 1px; height: 16px; background: var(--border); }

  .sort-label { font-size: 0.75rem; color: var(--ink-3); margin-left: auto; }
  .sort-select {
    font-size: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.25rem 0.5rem;
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
    font-family: inherit;
  }

  /* ── TASK LIST ── */
  .task-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 0.75rem 2rem 2rem;
  }

  /* Add task row */
  .add-task-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: var(--surface);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    margin-bottom: 0.5rem;
    cursor: text;
    transition: var(--trans);
  }
  .add-task-row:hover { border-color: var(--accent); }
  .add-task-row.open { border-style: solid; border-color: var(--accent); background: var(--surface); }

  .add-task-icon { font-size: 1.1rem; color: var(--accent); flex-shrink: 0; }

  .add-task-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
  }
  .add-task-input::placeholder { color: var(--ink-3); }

  .add-task-actions {
    display: none;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem 0.75rem 1rem;
    flex-wrap: wrap;
  }
  .add-task-row.open + .add-task-actions { display: flex; }

  .task-meta-input {
    font-size: 0.8rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.6rem;
    font-family: inherit;
    color: var(--ink-2);
    background: var(--surface);
    cursor: pointer;
  }
  .task-meta-input:focus { outline: none; border-color: var(--accent); }

  .priority-picker {
    display: flex;
    gap: 4px;
  }
  .prio-btn {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: var(--trans);
    font-size: 0.65rem;
    font-weight: 700;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .prio-btn.p1 { background: var(--p1); }
  .prio-btn.p2 { background: var(--p2); }
  .prio-btn.p3 { background: var(--p3); }
  .prio-btn.p4 { background: var(--border); color: var(--ink-3); }
  .prio-btn.selected { border-color: var(--ink); box-shadow: 0 0 0 2px rgba(0,0,0,.15); }

  .btn-add-task {
    padding: 0.4rem 1rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: var(--trans);
    margin-left: auto;
  }
  .btn-add-task:hover { background: #b45309; }

  .btn-cancel-task {
    padding: 0.4rem 0.75rem;
    background: transparent;
    color: var(--ink-3);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
    transition: var(--trans);
  }
  .btn-cancel-task:hover { border-color: var(--ink-3); color: var(--ink-2); }

  /* ── TASK ITEM ── */
  .task-group-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 1rem 0 0.4rem;
  }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.65rem 0.85rem;
    background: var(--surface);
    border-radius: var(--radius);
    margin-bottom: 3px;
    border: 1px solid transparent;
    transition: var(--trans);
    position: relative;
    cursor: pointer;
  }
  .task-item:hover { border-color: var(--border); box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .task-item.done { opacity: .5; }
  .task-item.done .task-title { text-decoration: line-through; color: var(--ink-3); }

  .task-check-wrap {
    flex-shrink: 0;
    margin-top: 1px;
  }

  .task-check {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--trans);
    background: transparent;
    flex-shrink: 0;
  }
  .task-check:hover { border-color: var(--done); background: rgba(22,163,74,.08); }
  .task-check.done { background: var(--done); border-color: var(--done); }
  .task-check.done::after { content: '✓'; color: #fff; font-size: 0.65rem; font-weight: 700; }

  .task-check.p1 { border-color: var(--p1); }
  .task-check.p2 { border-color: var(--p2); }
  .task-check.p3 { border-color: var(--p3); }

  .task-body { flex: 1; min-width: 0; }

  .task-title {
    font-size: 0.875rem;
    line-height: 1.4;
    color: var(--ink);
    word-break: break-word;
  }

  .task-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.25rem;
    flex-wrap: wrap;
  }

  .task-due {
    font-size: 0.7rem;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 0.2rem;
  }
  .task-due.overdue { color: var(--p1); font-weight: 600; }
  .task-due.today   { color: var(--done); font-weight: 600; }

  .task-list-tag {
    font-size: 0.65rem;
    padding: 1px 6px;
    border-radius: 20px;
    font-weight: 500;
    color: #fff;
  }

  .task-prio-flag {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    color: #fff;
  }
  .task-prio-flag.p1 { background: var(--p1); }
  .task-prio-flag.p2 { background: var(--p2); }
  .task-prio-flag.p3 { background: var(--p3); }

  /* ── TAGS ── */
  .task-tag {
    font-size: 0.65rem;
    padding: 1px 7px;
    border-radius: 20px;
    font-weight: 500;
    background: rgba(124,58,237,.12);
    color: #7c3aed;
    cursor: pointer;
    transition: var(--trans);
    border: 1px solid rgba(124,58,237,.2);
  }
  .task-tag:hover { background: rgba(124,58,237,.22); }

  .tag-input-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.4rem 0.6rem;
    background: var(--bg);
    min-height: 38px;
    cursor: text;
    transition: var(--trans);
  }
  .tag-input-wrap:focus-within { border-color: var(--accent); background: var(--surface); }

  .tag-pill-input {
    font-size: 0.65rem;
    padding: 1px 7px;
    border-radius: 20px;
    font-weight: 500;
    background: rgba(124,58,237,.12);
    color: #7c3aed;
    border: 1px solid rgba(124,58,237,.2);
    display: flex; align-items: center; gap: 4px;
  }
  .tag-pill-input button {
    background: none; border: none; cursor: pointer;
    color: #7c3aed; font-size: 0.7rem; padding: 0; line-height: 1;
  }

  .tag-text-input {
    border: none; outline: none;
    font-size: 0.8rem; font-family: inherit;
    color: var(--ink); background: transparent;
    min-width: 80px; flex: 1;
  }

  .nav-tag-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.45rem 1.25rem;
    font-size: 0.8rem;
    color: #d6d3d1;
    cursor: pointer;
    transition: var(--trans);
    border-left: 3px solid transparent;
  }
  .nav-tag-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-tag-item.active { background: rgba(255,255,255,.1); color: #fff; border-left-color: #a78bfa; font-weight: 500; }
  .nav-tag-item .tag-hash { color: #a78bfa; font-weight: 700; }

  .task-actions {
    display: none;
    gap: 0.25rem;
    flex-shrink: 0;
    align-items: center;
  }
  .task-item:hover .task-actions { display: flex; }

  .drag-handle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    flex-shrink: 0;
    color: var(--border);
    cursor: grab;
    font-size: 1rem;
    line-height: 1;
    user-select: none;
    padding: 0 2px;
    transition: color .15s;
  }
  .drag-handle:active { cursor: grabbing; }
  .task-item:hover .drag-handle { color: var(--ink-3); }
  .task-item.drag-over-top    { border-top: 2px solid var(--accent) !important; }
  .task-item.drag-over-bottom { border-bottom: 2px solid var(--accent) !important; }
  .task-item.dragging { opacity: .4; }

  .icon-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
    transition: var(--trans);
  }
  .icon-btn:hover { background: var(--bg); color: var(--ink); }
  .icon-btn.del:hover { background: #fee2e2; color: var(--p1); }

  /* ── SUBTASKS ── */
  .subtask-progress {
    font-size: 0.65rem;
    color: var(--ink-3);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .subtask-progress-bar {
    width: 36px; height: 3px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .subtask-progress-fill {
    height: 100%;
    background: var(--done);
    border-radius: 99px;
    transition: width .3s ease;
  }

  .subtask-list {
    margin-top: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-left: 1.6rem;
  }
  .subtask-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--ink-2);
    padding: 0.2rem 0;
  }
  .subtask-item.done span { text-decoration: line-through; color: var(--ink-3); }
  .subtask-check {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: var(--trans);
  }
  .subtask-check:hover { border-color: var(--done); }
  .subtask-check.done { background: var(--done); border-color: var(--done); }
  .subtask-check.done::after { content: '✓'; color: #fff; font-size: 0.55rem; font-weight: 700; }

  /* detail panel subtask section */
  .subtask-add-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .subtask-add-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font-size: 0.8rem;
    font-family: inherit;
    color: var(--ink);
    background: var(--bg);
    transition: var(--trans);
  }
  .subtask-add-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .subtask-add-btn {
    padding: 0.4rem 0.75rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: var(--trans);
  }
  .subtask-add-btn:hover { background: #b45309; }

  .detail-subtask-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.875rem;
  }
  .detail-subtask-item:last-child { border-bottom: none; }
  .detail-subtask-item.done > span { text-decoration: line-through; color: var(--ink-3); }
  .detail-subtask-item .subtask-del {
    margin-left: auto;
    background: none; border: none;
    color: var(--ink-3); cursor: pointer;
    font-size: 0.8rem; padding: 0 4px;
    opacity: 0; transition: var(--trans);
  }
  .detail-subtask-item:hover .subtask-del { opacity: 1; }
  .detail-subtask-item .subtask-del:hover { color: var(--p1); }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--ink-3);
  }
  .empty-state .big-icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty-state p { font-size: 0.9rem; font-weight: 300; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border-radius: 14px;
    padding: 1.5rem;
    width: min(420px, 90vw);
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
    transform: translateY(10px);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal h3 { font-family: 'DM Serif Display', serif; font-size: 1.3rem; margin-bottom: 1rem; }

  .modal-field {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    margin-bottom: 0.85rem;
  }
  .modal-field label { font-size: 0.75rem; font-weight: 600; color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; }
  .modal-field input, .modal-field textarea, .modal-field select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-family: inherit;
    font-size: 0.875rem;
    color: var(--ink);
    transition: var(--trans);
    background: var(--bg);
  }
  .modal-field input:focus, .modal-field textarea:focus, .modal-field select:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }
  .modal-field textarea { min-height: 70px; resize: vertical; }

  .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }

  .btn-primary {
    padding: 0.5rem 1.25rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: var(--trans);
  }
  .btn-primary:hover { background: #b45309; }

  .btn-ghost {
    padding: 0.5rem 1rem;
    background: transparent;
    color: var(--ink-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.875rem;
    cursor: pointer;
    font-family: inherit;
    transition: var(--trans);
  }
  .btn-ghost:hover { border-color: var(--ink-3); }

  /* ── TASK DETAIL PANEL ── */
  .detail-panel {
    width: 340px;
    border-left: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transform: translateX(100%);
    transition: transform .2s ease;
    overflow-y: auto;
    padding: 1.5rem;
  }
  .detail-panel.open { transform: translateX(0); }

  .detail-panel h3 { font-family: 'DM Serif Display', serif; font-size: 1.2rem; margin-bottom: 1rem; }
  .detail-close {
    position: absolute; top: 1rem; right: 1rem;
    background: none; border: none; cursor: pointer;
    font-size: 1.2rem; color: var(--ink-3);
  }

  .color-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .color-swatch {
    width: 22px; height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: var(--trans);
  }
  .color-swatch.selected, .color-swatch:hover { border-color: var(--ink); transform: scale(1.15); }

  /* ── REPEAT ── */
  .repeat-badge {
    font-size: 0.65rem;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .repeat-badge.active { color: #0891b2; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  /* ── RESPONSIVE ── */
  @media(max-width: 640px) {
    .sidebar { position: fixed; left:-240px; top:0; bottom:0; z-index:200; transition: left .2s; }
    .sidebar.open { left:0; }
    .topbar { padding: 1rem 1rem 0; }
    .task-scroll { padding: 0.75rem 1rem 2rem; }
    .filter-bar { padding: 0.5rem 1rem; }
    .detail-panel { position: fixed; inset:0; width:100%; transform:translateX(100%); z-index:300; }
  }
</style>
</head>
<body>

<div class="shell">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="dot"></div>
      Tasks
      <div class="sync-dot" id="syncDot" title="Sync status"></div>
    </div>

    <div class="sidebar-section">
      <div class="nav-item active" onclick="setView('today')" data-view="today">
        <span class="nav-icon">☀️</span> Today

      </div>
      <div class="nav-item" onclick="setView('upcoming')" data-view="upcoming">
        <span class="nav-icon">📅</span> Upcoming
        <span class="nav-count" id="cnt-upcoming">0</span>
      </div>
      <div class="nav-item" onclick="setView('all')" data-view="all">
        <span class="nav-icon">📋</span> All Tasks
        <span class="nav-count" id="cnt-all">0</span>
      </div>
      <div class="nav-item" onclick="setView('done')" data-view="done">
        <span class="nav-icon">✅</span> Completed
      </div>
    </div>

    <div class="sidebar-section" style="margin-top:.5rem; border-top:1px solid rgba(255,255,255,.06); padding-top:.5rem;">
      <div class="sidebar-label">Lists</div>
      <div id="listNav"></div>
      <div class="add-list-btn" onclick="openAddList()">
        <span>＋</span> Add List
      </div>
    </div>

    <div class="sidebar-section" style="margin-top:.5rem; border-top:1px solid rgba(255,255,255,.06); padding-top:.5rem;">
      <div class="sidebar-label">Tags</div>

    </div>
  </aside>

  <!-- ── MAIN ── -->
  <main class="main">
    <div class="topbar">
      <div class="view-title" id="viewTitle">Today</div>

    <div class="filter-bar">
      <button class="filter-chip active" onclick="setFilter('open',this)">Open</button>
      <button class="filter-chip" onclick="setFilter('all',this)">All</button>
      <div class="filter-sep"></div>
      <button class="filter-chip" onclick="setFilter('p1',this)">🔴 P1</button>
      <button class="filter-chip" onclick="setFilter('p2',this)">🟠 P2</button>
      <button class="filter-chip" onclick="setFilter('p3',this)">🔵 P3</button>
      <span class="sort-label">Sort</span>
      <select class="sort-select" id="sortSelect" onchange="renderTasks()">
        <option value="created">Date added</option>
        <option value="due">Due date</option>
        <option value="priority">Priority</option>
        <option value="alpha">A → Z</option>
      </select>
    </div>

    <div class="task-scroll">

      <!-- Add Task -->
      <div class="add-task-row" id="addTaskRow" onclick="openAddRow()">
        <span class="add-task-icon">＋</span>
        <input class="add-task-input" id="addTaskInput" placeholder="Add a task…" onkeydown="addTaskKeydown(event)" />
      </div>
      <div class="add-task-actions" id="addTaskActions">
        <input type="date" class="task-meta-input" id="newDue" />
        <select class="task-meta-input" id="newList" style="max-width:140px;"></select>
        <select class="task-meta-input" id="newRepeat" style="max-width:110px;">
          <option value="none">No repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
        <div class="priority-picker" id="newPrioPicker">
          <div class="prio-btn p1" data-p="1" onclick="selectPrio(this)" title="P1 – Urgent">1</div>
          <div class="prio-btn p2" data-p="2" onclick="selectPrio(this)" title="P2 – High">2</div>
          <div class="prio-btn p3" data-p="3" onclick="selectPrio(this)" title="P3 – Medium">3</div>
          <div class="prio-btn p4 selected" data-p="4" onclick="selectPrio(this)" title="No priority">–</div>
        </div>
        <div class="tag-input-wrap" id="newTagWrap" onclick="document.getElementById('newTagInput').focus()" style="flex:1;min-width:120px;">
          <input class="tag-text-input" id="newTagInput" placeholder="Add tags…" onkeydown="newTagKeydown(event)" />
        </div>
        <button class="btn-cancel-task" onclick="closeAddRow()">Cancel</button>
        <button class="btn-add-task" onclick="addTask()">Add</button>
      </div>

      <!-- Task list -->
      <div id="taskList"></div>

    </div>
  </main>

  <!-- ── DETAIL PANEL ── -->
  <aside class="detail-panel" id="detailPanel">
    <div style="position:relative; margin-bottom:1rem;">
      <h3 id="detailTitle">Task Detail</h3>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div id="detailBody"></div>
  </aside>

</div>

<!-- ── ADD LIST MODAL ── -->
<div class="modal-overlay" id="listModal">
  <div class="modal">
    <h3>New List</h3>

</div>

<!-- ── EDIT TASK MODAL ── -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Edit Task</h3>
    <input type="hidden" id="editTaskId" />
    <div class="modal-field">
      <label>Task</label>

      <label>Priority</label>
      <div class="priority-picker" id="editPrioPicker">
        <div class="prio-btn p1" data-p="1" onclick="selectEditPrio(this)">1</div>
        <div class="prio-btn p2" data-p="2" onclick="selectEditPrio(this)">2</div>
        <div class="prio-btn p3" data-p="3" onclick="selectEditPrio(this)">3</div>
        <div class="prio-btn p4 selected" data-p="4" onclick="selectEditPrio(this)">–</div>

      <label>Tags</label>
      <div class="tag-input-wrap" id="editTagWrap" onclick="document.getElementById('editTagInput').focus()">
        <input class="tag-text-input" id="editTagInput" placeholder="Type a tag and press Enter…" onkeydown="editTagKeydown(event)" />
      </div>
    </div>
    <div class="modal-field">
      <label>Repeat</label>
      <select id="editRepeat">
        <option value="none">No repeat</option>
        <option value="daily">Daily</option>

      </select>

</div>

<script>
// ─── Firebase ───────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCOkn1TUMnMQLpipLaBj3joU18-X9_YY9A",
  authDomain: "health-tracker-c72a2.firebaseapp.com",
  projectId: "health-tracker-c72a2",
  storageBucket: "health-tracker-c72a2.firebasestorage.app",
  messagingSenderId: "322478791608",
  appId: "1:322478791608:web:ba1e127icce0c6b2688d4d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const tasksCol = db.collection('tasks');
const listsCol = db.collection('task-lists');

// ─── State ───────────────────────────────────────────────────────────────────
let tasks  = [];
let lists  = [];
let currentView   = 'today';
let currentFilter = 'open';
let currentTag    = null;   // active tag filter from sidebar
let selectedPrio  = '4';
let selectedEditPrio = '4';
let selectedListColor = '#d97706';
let openDetailId  = null;
let newTags  = [];   // tags being built in add-task row
let editTags = [];   // tags being built in edit modal

// ─── Sync UI ─────────────────────────────────────────────────────────────────
function setSyncStatus(s) {
  const d = document.getElementById('syncDot');
  d.className = 'sync-dot ' + s;
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
const today   = () => new Date().toISOString().split('T')[0];
const todayD  = () => new Date(); // local midnight

function parseDue(str) {
  if (!str) return null;
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatDue(str) {
  if (!str) return '';
  const d = parseDue(str);
  const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((d - t) / 86400000);
  if (diff < 0) return { label: `${Math.abs(diff)}d overdue`, cls: 'overdue' };
  if (diff === 0) return { label: 'Today', cls: 'today' };
  if (diff === 1) return { label: 'Tomorrow', cls: '' };
  return { label: d.toLocaleDateString('en-US',{month:'short',day:'numeric'}), cls: '' };
}

const REPEAT_LABELS = { daily:'Daily', weekly:'Weekly', monthly:'Monthly', yearly:'Yearly' };

function nextDueDate(due, repeat) {
  if (!due || !repeat || repeat === 'none') return null;
  const d = parseDue(due);
  if (repeat === 'daily')   d.setDate(d.getDate() + 1);
  if (repeat === 'weekly')  d.setDate(d.getDate() + 7);
  if (repeat === 'monthly') d.setMonth(d.getMonth() + 1);
  if (repeat === 'yearly')  d.setFullYear(d.getFullYear() + 1);
  return d.toISOString().split('T')[0];
}

function listFor(id) { return lists.find(l => l.id === id); }
function prioColor(p) { return {1:'var(--p1)',2:'var(--p2)',3:'var(--p3)',4:'var(--p4)'}[p]||'var(--p4)'; }

// ─── Colors for lists ─────────────────────────────────────────────────────────
const LIST_COLORS = [
  '#d97706','#dc2626','#16a34a','#2563eb','#7c3aed',
  '#db2777','#0891b2','#65a30d','#ea580c','#78716c'
];

// ─── Bootstrap ───────────────────────────────────────────────────────────────
function buildColorSwatches() {
  const el = document.getElementById('colorSwatches');
  el.innerHTML = LIST_COLORS.map(c =>
    `<div class="color-swatch ${c===selectedListColor?'selected':''}" 
      style="background:${c}" data-color="${c}" onclick="pickColor(this,'${c}')"></div>`
  ).join('');
}

function pickColor(el, c) {
  selectedListColor = c;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
}

// ─── Load data ────────────────────────────────────────────────────────────────
async function loadAll() {
  setSyncStatus('syncing');
  try {
    // Lists
    listsCol.onSnapshot(snap => {
      lists = snap.docs.map(d => ({id:d.id,...d.data()}));
      renderListNav();
      populateListSelects();
      renderTasks();
    });

    // Tasks
    tasksCol.orderBy('createdAt','desc').onSnapshot(snap => {
      tasks = snap.docs.map(d => ({id:d.id,...d.data()}));
      updateCounts();
      renderTasks();
      renderTagNav();
      setSyncStatus('');
    });
  } catch(e) {
    console.error(e);
    setSyncStatus('offline');
  }
}

// ─── Counts ──────────────────────────────────────────────────────────────────
function updateCounts() {
  const t = today();
  const open = tasks.filter(tk => !tk.done);
  document.getElementById('cnt-all').textContent     = open.length;
  document.getElementById('cnt-today').textContent   = open.filter(tk => !tk.due || tk.due <= t).length;
  document.getElementById('cnt-upcoming').textContent = open.filter(tk => tk.due && tk.due > t).length;
}

// ─── Views ───────────────────────────────────────────────────────────────────
function setTagView(tag) {
  currentTag = tag;
  currentView = 'tag';
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-tag-item').forEach(el => {
    el.classList.toggle('active', el.textContent.trim().startsWith('#'+tag));
  });
  document.getElementById('viewTitle').textContent = '#' + tag;
  document.getElementById('viewSubtitle').textContent = 'Tasks tagged with #' + tag;
  renderTasks();
  closeSidebar();
}

function setView(v) {
  currentView = v;
  currentTag = null;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === v || el.dataset.list === v);
  });
  document.querySelectorAll('.nav-tag-item').forEach(el => el.classList.remove('active'));

  const titles = {today:'Today', upcoming:'Upcoming', all:'All Tasks', done:'Completed'};
  document.getElementById('viewTitle').textContent = titles[v] || (listFor(v)?.name || v);

  const t = today();
  const subs = {
    today: new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),
    upcoming: 'Tasks with future due dates',
    all: 'Every open task',
    done: 'Completed tasks'
  };
  document.getElementById('viewSubtitle').textContent = subs[v] || '';

  renderTasks();
  closeSidebar();
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderTasks() {
  const t = today();
  let filtered = [...tasks];

  // View filter
  if (currentView === 'today') {
    filtered = filtered.filter(tk => !tk.done && (!tk.due || tk.due <= t));
  } else if (currentView === 'upcoming') {
    filtered = filtered.filter(tk => !tk.done && tk.due && tk.due > t);
  } else if (currentView === 'all') {
    filtered = filtered.filter(tk => !tk.done);
  } else if (currentView === 'done') {
    filtered = filtered.filter(tk => tk.done);
  } else if (currentView === 'tag') {
    filtered = filtered.filter(tk => !tk.done && (tk.tags||[]).includes(currentTag));
  } else {
    // list view
    filtered = filtered.filter(tk => tk.listId === currentView && !tk.done);
  }

  // Filter chip
  if (currentFilter === 'open') { /* already filtered */ }
  else if (currentFilter === 'all') { /* show done too if not done-view */ }
  else if (['p1','p2','p3'].includes(currentFilter)) {
    const p = currentFilter.replace('p','');
    filtered = filtered.filter(tk => String(tk.priority) === p);
  }

  // Sort
  const sort = document.getElementById('sortSelect').value;
  if (sort === 'due') {
    filtered.sort((a,b) => {
      if (!a.due && !b.due) return 0;
      if (!a.due) return 1;
      if (!b.due) return -1;
      return a.due < b.due ? -1 : 1;
    });
  } else if (sort === 'priority') {
    filtered.sort((a,b) => (a.priority||4) - (b.priority||4));
  } else if (sort === 'alpha') {
    filtered.sort((a,b) => a.title.localeCompare(b.title));
  } else {
    // manual order field first, fall back to createdAt
    filtered.sort((a,b) => {
      const ao = a.order ?? a.createdAt?.seconds ?? 0;
      const bo = b.order ?? b.createdAt?.seconds ?? 0;
      return ao - bo;
    });
  }

  const container = document.getElementById('taskList');

  if (filtered.length === 0) {
    const icons = {today:'☀️',upcoming:'📅',all:'🎉',done:'✅'};
    const msgs  = {
      today:'Nothing due today — great work!',
      upcoming:'No upcoming tasks.',
      all:'No open tasks. Add one above.',
      done:'Nothing completed yet.'
    };
    container.innerHTML = `<div class="empty-state">
      <div class="big-icon">${icons[currentView]||'📋'}</div>
      <p>${msgs[currentView]||'No tasks in this list.'}</p>
    </div>`;
    return;
  }

  container.innerHTML = filtered.map(tk => taskHTML(tk)).join('');

  // Attach drag-and-drop if sorted by manual order
  if (sort === 'created') attachDragHandlers(filtered);
}

function taskHTML(tk) {
  const lst = listFor(tk.listId);
  const dueInfo = tk.due ? formatDue(tk.due) : null;
  const p = tk.priority || 4;
  const pClass = p < 4 ? `p${p}` : '';
  const subtasks = tk.subtasks || [];
  const stTotal = subtasks.length;
  const stDone  = subtasks.filter(s => s.done).length;
  const stPct   = stTotal ? Math.round((stDone/stTotal)*100) : 0;

  const subtaskListHTML = stTotal ? `
    <div class="subtask-list">
      ${subtasks.map((s,i) => `
        <div class="subtask-item ${s.done?'done':''}">
          <div class="subtask-check ${s.done?'done':''}"
            onclick="event.stopPropagation();toggleSubtask('${tk.id}',${i})"></div>
          <span>${escHtml(s.title)}</span>
        </div>`).join('')}
    </div>` : '';

  return `
  <div class="task-item ${tk.done?'done':''}" data-id="${tk.id}" onclick="handleTaskClick(event,'${tk.id}')">
    <div class="drag-handle" title="Drag to reorder">⠿</div>
    <div class="task-check-wrap">
      <div class="task-check ${tk.done?'done':''} ${!tk.done&&pClass?pClass:''}"
        onclick="event.stopPropagation();toggleDone('${tk.id}',${!tk.done})">
      </div>
    </div>
    <div class="task-body">
      <div class="task-title">${escHtml(tk.title)}</div>
      <div class="task-meta">
        ${dueInfo ? `<span class="task-due ${dueInfo.cls}">📅 ${dueInfo.label}</span>` : ''}
        ${lst ? `<span class="task-list-tag" style="background:${lst.color||'#888'}">${escHtml(lst.name)}</span>` : ''}
        ${p < 4 ? `<span class="task-prio-flag p${p}">P${p}</span>` : ''}
        ${(tk.tags||[]).map(tag => `<span class="task-tag" onclick="event.stopPropagation();setTagView('${escHtml(tag)}')">#${escHtml(tag)}</span>`).join('')}
        ${tk.notes ? `<span style="font-size:.7rem;color:var(--ink-3)">📝</span>` : ''}
        ${stTotal ? `<span class="subtask-progress">
          <div class="subtask-progress-bar"><div class="subtask-progress-fill" style="width:${stPct}%"></div></div>
          ${stDone}/${stTotal}
        </span>` : ''}
        ${tk.repeat && tk.repeat !== 'none' ? `<span class="repeat-badge active">🔁 ${REPEAT_LABELS[tk.repeat]}</span>` : ''}
      </div>
      ${subtaskListHTML}
    </div>
    <div class="task-actions" onclick="event.stopPropagation()">
      <button class="icon-btn" onclick="openEdit('${tk.id}')" title="Edit">✏️</button>
      <button class="icon-btn del" onclick="deleteTask('${tk.id}')" title="Delete">🗑</button>
    </div>
  </div>`;
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function handleTaskClick(e, id) {
  if (e.target.closest('.task-actions') || e.target.closest('.task-check-wrap')) return;
  openDetail(id);
}

// ─── List nav ─────────────────────────────────────────────────────────────────
function renderListNav() {
  const el = document.getElementById('listNav');
  el.innerHTML = lists.map(l => `
    <div class="nav-item" data-list="${l.id}" onclick="setView('${l.id}')">
      <div class="list-color-dot" style="background:${l.color||'#888'}"></div>
      ${escHtml(l.name)}
      <span class="nav-count">${tasks.filter(t=>t.listId===l.id&&!t.done).length}</span>
    </div>
  `).join('');
}

function renderTagNav() {
  const el = document.getElementById('tagNav');
  // collect all unique tags across all tasks
  const tagCounts = {};
  tasks.filter(t => !t.done).forEach(t => {
    (t.tags||[]).forEach(tag => {
      tagCounts[tag] = (tagCounts[tag]||0) + 1;
    });
  });
  const allTags = Object.keys(tagCounts).sort();
  if (allTags.length === 0) {
    el.innerHTML = '<div style="padding:.3rem 1.25rem;font-size:.75rem;color:#57534e;">No tags yet</div>';
    return;
  }
  el.innerHTML = allTags.map(tag => `
    <div class="nav-tag-item ${currentTag===tag?'active':''}" onclick="setTagView('${escHtml(tag)}')">
      <span class="tag-hash">#</span>${escHtml(tag)}
      <span class="nav-count" style="background:rgba(167,139,250,.2);color:#a78bfa;">${tagCounts[tag]}</span>
    </div>
  `).join('');
}

function populateListSelects() {
  const opts = `<option value="">No list</option>` + lists.map(l =>
    `<option value="${l.id}">${escHtml(l.name)}</option>`
  ).join('');
  document.getElementById('newList').innerHTML = opts;
  document.getElementById('editList').innerHTML = opts;
}

// ─── Tag input helpers ────────────────────────────────────────────────────────
function renderTagPills(wrapId, tagsArr, removeCallback) {
  const wrap = document.getElementById(wrapId);
  const input = wrap.querySelector('.tag-text-input');
  // remove existing pills
  wrap.querySelectorAll('.tag-pill-input').forEach(p => p.remove());
  tagsArr.forEach((tag, i) => {
    const pill = document.createElement('div');
    pill.className = 'tag-pill-input';
    pill.innerHTML = `#${escHtml(tag)}<button onclick="${removeCallback}(${i})" type="button">✕</button>`;
    wrap.insertBefore(pill, input);
  });
}

function newTagKeydown(e) {
  if (e.key === 'Enter' || e.key === ',' || e.key === ' ') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/^#/,'').replace(/[^a-zA-Z0-9_-]/g,'');
    if (val && !newTags.includes(val)) { newTags.push(val); }
    e.target.value = '';
    renderTagPills('newTagWrap', newTags, 'removeNewTag');
  }
  if (e.key === 'Backspace' && e.target.value === '' && newTags.length) {
    newTags.pop();
    renderTagPills('newTagWrap', newTags, 'removeNewTag');
  }
}

function removeNewTag(i) { newTags.splice(i,1); renderTagPills('newTagWrap', newTags, 'removeNewTag'); }

function editTagKeydown(e) {
  if (e.key === 'Enter' || e.key === ',' || e.key === ' ') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/^#/,'').replace(/[^a-zA-Z0-9_-]/g,'');
    if (val && !editTags.includes(val)) { editTags.push(val); }
    e.target.value = '';
    renderTagPills('editTagWrap', editTags, 'removeEditTag');
  }
  if (e.key === 'Backspace' && e.target.value === '' && editTags.length) {
    editTags.pop();
    renderTagPills('editTagWrap', editTags, 'removeEditTag');
  }
}

function removeEditTag(i) { editTags.splice(i,1); renderTagPills('editTagWrap', editTags, 'removeEditTag'); }

// ─── Add task ─────────────────────────────────────────────────────────────────
function openAddRow() {
  document.getElementById('addTaskRow').classList.add('open');
  document.getElementById('addTaskInput').focus();
}
function closeAddRow() {
  document.getElementById('addTaskRow').classList.remove('open');
  document.getElementById('addTaskInput').value = '';
  document.getElementById('newDue').value = '';
  document.getElementById('newRepeat').value = 'none';
  document.getElementById('newTagInput').value = '';
  newTags = [];
  renderTagPills('newTagWrap', newTags, 'removeNewTag');
  selectedPrio = '4';
  document.querySelectorAll('#newPrioPicker .prio-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.p === '4');
  });
}

function addTaskKeydown(e) {
  if (e.key === 'Enter') addTask();
  if (e.key === 'Escape') closeAddRow();
}

function selectPrio(el) {
  selectedPrio = el.dataset.p;
  document.querySelectorAll('#newPrioPicker .prio-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

async function addTask() {
  const title = document.getElementById('addTaskInput').value.trim();
  if (!title) return;

  // flush any partially typed tag
  const partialTag = document.getElementById('newTagInput').value.trim().replace(/^#/,'').replace(/[^a-zA-Z0-9_-]/g,'');
  if (partialTag && !newTags.includes(partialTag)) newTags.push(partialTag);

  const entry = {
    title,
    done: false,
    priority: parseInt(selectedPrio) || 4,
    due: document.getElementById('newDue').value || null,
    listId: document.getElementById('newList').value || null,
    repeat: document.getElementById('newRepeat').value || 'none',
    tags: [...newTags],
    notes: '',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    setSyncStatus('syncing');
    await tasksCol.add(entry);
    closeAddRow();
    setSyncStatus('');
  } catch(e) {
    console.error(e); setSyncStatus('offline');
  }
}

// ─── Toggle done ─────────────────────────────────────────────────────────────
async function toggleDone(id, done) {
  try {
    setSyncStatus('syncing');
    const tk = tasks.find(t => t.id === id);
    await tasksCol.doc(id).update({ done, doneAt: done ? new Date().toISOString() : null });

    // If completing a repeating task, spawn next occurrence
    if (done && tk && tk.repeat && tk.repeat !== 'none') {
      const next = nextDueDate(tk.due, tk.repeat);
      if (next) {
        await tasksCol.add({
          title:    tk.title,
          done:     false,
          priority: tk.priority || 4,
          due:      next,
          listId:   tk.listId || null,
          repeat:   tk.repeat,
          tags:     tk.tags || [],
          notes:    tk.notes || '',
          subtasks: (tk.subtasks||[]).map(s => ({...s, done: false})), // reset subtasks
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }
    setSyncStatus('');
  } catch(e) { console.error(e); setSyncStatus('offline'); }
}

// ─── Delete ──────────────────────────────────────────────────────────────────
async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  try {
    await tasksCol.doc(id).delete();
  } catch(e) { console.error(e); }
}

// ─── Edit modal ──────────────────────────────────────────────────────────────
function openEdit(id) {
  const tk = tasks.find(t => t.id === id);
  if (!tk) return;

  document.getElementById('editTaskId').value = id;
  document.getElementById('editTitle').value  = tk.title;
  document.getElementById('editNotes').value  = tk.notes||'';
  document.getElementById('editDue').value    = tk.due||'';
  document.getElementById('editList').value   = tk.listId||'';

  editTags = [...(tk.tags||[])];
  document.getElementById('editTagInput').value = '';
  renderTagPills('editTagWrap', editTags, 'removeEditTag');
  document.getElementById('editRepeat').value = tk.repeat || 'none';

  selectedEditPrio = String(tk.priority||4);
  document.querySelectorAll('#editPrioPicker .prio-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.p === selectedEditPrio);
  });

  openModal('editModal');
}

function selectEditPrio(el) {
  selectedEditPrio = el.dataset.p;
  document.querySelectorAll('#editPrioPicker .prio-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');

async function saveEdit() {
  const id = document.getElementById('editTaskId').value;
  // flush any partially typed tag
  const partialTag = document.getElementById('editTagInput').value.trim().replace(/^#/,'').replace(/[^a-zA-Z0-9_-]/g,'');
  if (partialTag && !editTags.includes(partialTag)) editTags.push(partialTag);

  const data = {
    title:    document.getElementById('editTitle').value.trim(),
    notes:    document.getElementById('editNotes').value.trim(),
    due:      document.getElementById('editDue').value || null,
    listId:   document.getElementById('editList').value || null,
    priority: parseInt(selectedEditPrio) || 4,
    repeat:   document.getElementById('editRepeat').value || 'none',
    tags:     [...editTags],
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  if (!data.title) return;
  try {
    setSyncStatus('syncing');
    await tasksCol.doc(id).update(data);
    closeModal('editModal');
    setSyncStatus('');
  } catch(e) { console.error(e); setSyncStatus('offline'); }
}

// ─── Drag to reorder ──────────────────────────────────────────────────────────
let dragSrcId = null;

function attachDragHandlers(orderedTasks) {
  const container = document.getElementById('taskList');
  const items = container.querySelectorAll('.task-item');

  items.forEach(item => {
    const handle = item.querySelector('.drag-handle');
    if (!handle) return;

    // Only the handle initiates drag
    handle.addEventListener('mousedown', () => { item.draggable = true; });
    handle.addEventListener('mouseup',   () => { item.draggable = false; });

    item.addEventListener('dragstart', e => {
      dragSrcId = item.dataset.id;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    item.addEventListener('dragend', () => {
      item.draggable = false;
      item.classList.remove('dragging');
      container.querySelectorAll('.task-item').forEach(el => {
        el.classList.remove('drag-over-top','drag-over-bottom');
      });
    });

    item.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (item.dataset.id === dragSrcId) return;
      const rect = item.getBoundingClientRect();
      const mid  = rect.top + rect.height / 2;
      container.querySelectorAll('.task-item').forEach(el => {
        el.classList.remove('drag-over-top','drag-over-bottom');
      });
      item.classList.add(e.clientY < mid ? 'drag-over-top' : 'drag-over-bottom');
    });

    item.addEventListener('dragleave', () => {
      item.classList.remove('drag-over-top','drag-over-bottom');
    });

    item.addEventListener('drop', async e => {
      e.preventDefault();
      if (item.dataset.id === dragSrcId) return;

      const rect     = item.getBoundingClientRect();
      const dropBefore = e.clientY < rect.top + rect.height / 2;
      const ids      = orderedTasks.map(t => t.id);
      const srcIdx   = ids.indexOf(dragSrcId);
      let   tgtIdx   = ids.indexOf(item.dataset.id);

      if (srcIdx === -1 || tgtIdx === -1) return;

      // Remove src, insert at target
      ids.splice(srcIdx, 1);
      tgtIdx = ids.indexOf(item.dataset.id);
      ids.splice(dropBefore ? tgtIdx : tgtIdx + 1, 0, dragSrcId);

      // Batch-write new order values
      try {
        setSyncStatus('syncing');
        const batch = db.batch();
        ids.forEach((id, idx) => {
          batch.update(tasksCol.doc(id), { order: idx });
        });
        await batch.commit();
        setSyncStatus('');
      } catch(err) {
        console.error(err); setSyncStatus('offline');
      }
    });
  });
}

// ─── Subtask functions ────────────────────────────────────────────────────────
function editSubtaskInline(taskId, index, spanEl) {
  const current = spanEl.textContent;
  const input = document.createElement('input');
  input.value = current;
  input.style.cssText = 'flex:1;border:none;border-bottom:2px solid var(--accent);outline:none;font-size:.875rem;font-family:inherit;color:var(--ink);background:transparent;padding:1px 0;';
  spanEl.replaceWith(input);
  input.focus();
  input.select();

  async function save() {
    const val = input.value.trim();
    if (!val || val === current) {
      // restore original
      const span = document.createElement('span');
      span.textContent = current;
      span.ondblclick = () => editSubtaskInline(taskId, index, span);
      input.replaceWith(span);
      return;
    }
    const tk = tasks.find(t => t.id === taskId);
    if (!tk) return;
    const subtasks = (tk.subtasks||[]).map((s,i) => i === index ? {...s, title: val} : s);
    try {
      setSyncStatus('syncing');
      await tasksCol.doc(taskId).update({ subtasks });
      setSyncStatus('');
      openDetail(taskId);
    } catch(e) { console.error(e); setSyncStatus('offline'); }
  }

  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { input.blur(); }
    if (e.key === 'Escape') { input.value = current; input.blur(); }
  });
}

async function addSubtask(taskId) {
  const input = document.getElementById('subtaskInput');
  const title = input?.value.trim();
  if (!title) return;

  const tk = tasks.find(t => t.id === taskId);
  if (!tk) return;

  const subtasks = [...(tk.subtasks||[]), { title, done: false, id: Date.now().toString() }];
  try {
    setSyncStatus('syncing');
    await tasksCol.doc(taskId).update({ subtasks });
    setSyncStatus('');
    if (input) input.value = '';
    openDetail(taskId); // re-render panel
  } catch(e) { console.error(e); setSyncStatus('offline'); }
}

async function toggleSubtask(taskId, index) {
  const tk = tasks.find(t => t.id === taskId);
  if (!tk) return;
  const subtasks = (tk.subtasks||[]).map((s,i) => i === index ? {...s, done: !s.done} : s);
  try {
    setSyncStatus('syncing');
    await tasksCol.doc(taskId).update({ subtasks });
    setSyncStatus('');
    openDetail(taskId);
  } catch(e) { console.error(e); setSyncStatus('offline'); }
}

async function deleteSubtask(taskId, index) {
  const tk = tasks.find(t => t.id === taskId);
  if (!tk) return;
  const subtasks = (tk.subtasks||[]).filter((_,i) => i !== index);
  try {
    await tasksCol.doc(taskId).update({ subtasks });
    openDetail(taskId);
  } catch(e) { console.error(e); }
}

function closeDetail() {
  openDetailId = null;
  document.getElementById('detailPanel').classList.remove('open');
}

document.addEventListener('DOMContentLoaded', () => {
